#
#	/etc/samba/smb.conf
#

#####	GLOBAL	#####

[global]
    realm = MYDOM1
    workgroup = MYDOM1
    security = ads
    kerberos method = secrets and keytab
    server string = Samba Server Version %v
    machine password timeout = 0

#
### Options
#
    template homedir = /storage/home/%U
    server string = Samba Server Version %v
    log file = /var/log/samba/log.%m
    max log size = 8192
    log level = 5

#
### winbind
## (if 'winbind use default domain = no' then short @MYDOM1 or even @MYDOM1.NET must be appended)
    winbind refresh tickets = yes
    winbind offline logon = yes
    winbind enum groups = yes
    winbind enum users = yes
    winbind use default domain = yes
# NO #	winbind use default domain = no

#
### idmap config (local default)
    idmap config * : range = 10000000-10999999
## do NOT touch
# tdb
    idmap config * : backend = tdb

#
### idmap config (directory)
# NO #    idmap config MYDOM1 : range = 2500-999999
# NO #    idmap config MYDOM1 : schema_mode = rfc2307
    idmap config MYDOM1.NET : range = 2500-999999
    idmap config MYDOM1.NET : schema_mode = rfc2307
## pick *ONLY ONE* of the following 'idmap config' (directory) 'backends'
#
# ad (see man 8 idmap_ad) -- install samba-winbind
#
# NO #	idmap config MYDOM1 : backend = ad
# NO #	idmap config MYDOM1 : unix_nss_info = yes
# NO #	idmap config MYDOM1 : unix_primary_group = yes
# NO #	idmap config MYDOM1.NET : backend = ad
# NO #	idmap config MYDOM1.NET : unix_nss_info = yes
# NO #	idmap config MYDOM1.NET : unix_primary_group = yes
#
# sss (man 8 idmap_sss) -- install sssd-winbind-idmap
#
# NO #	idmap config MYDOM1 : backend = sss
	idmap config MYDOM1 : backend = sss

#
### Legacy Security
## (use v4.x auto-defaults or issues might arise)
#
# D #	lanman auth = no
# D #	encrypt passwords = yes
# D #	client use spnego = yes
# D #	client lanman auth = no
#	client ntlmv2 auth = yes
#	server signing = mandatory
#	#server signing = auto
#	client signing = mandatory
#	#client signing = auto
#	client ldap sasl wrapping = seal
#	password server = dc01.MYDOM1.NET
#	password server = dc02.MYDOM1.NET

#
### Printing
## (disabled)
#
	load printers = no
	printing = bsd
	printcap name = /dev/null
	disable spoolss = yes
	machine password timeout = 0


#####	SHARES	#####

#
### IT
## (initial test share)
#
[IT]
	comment = IT only Share
	browsable = yes
	writable = yes
	path = /storage/IT/
	guest ok = no
	create mask = 0770
	directory mask = 0770
## if 'winbind use default domain = yes' then use 'valid users' w/o appended @MYDOM1 or @MYDOM1.NET
 	valid users = @IT
# NO #	valid users = @IT@MYDOM1
# NO #	valid users = @IT@MYDOM1.NET


